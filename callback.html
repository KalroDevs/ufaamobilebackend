<!DOCTYPE html>
<html>
<head>
    <title>Redirecting to UFAA Reunite...</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #262561 0%, #1a1a4f 100%);
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo img {
            width: 60px;
            height: 60px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #E4B355;
            animation: spin 1s ease-in-out infinite;
            margin: 30px auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background-color: #E4B355;
            color: #262561;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        .button:hover {
            background-color: #d4a345;
            transform: scale(1.02);
        }
        
        .button:active {
            transform: scale(0.98);
        }
        
        .message {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
        
        .error-message {
            margin-top: 20px;
            padding: 12px;
            background-color: rgba(255, 68, 68, 0.2);
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 16px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .button {
                padding: 12px 24px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <!-- You can add your app logo here -->
            <div style="font-size: 40px;">🏦</div>
        </div>
        <h1>UFAA Reunite</h1>
        <p>Redirecting you back to the app...</p>
        <div class="spinner"></div>
        <p class="message">Please wait while we redirect you to the UFAA Reunite app.</p>
        <button id="openAppButton" class="button">Open UFAA Reunite App</button>
        <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const params = {};
        for (const [key, value] of urlParams.entries()) {
            params[key] = value;
        }
        
        console.log('Callback params:', params);
        
        // Build deep link URL
        const queryString = new URLSearchParams(params).toString();
        const deepLinkUrl = `ufaareunite://callback?${queryString}`;
        
        console.log('Deep link URL:', deepLinkUrl);
        
        let attempts = 0;
        const maxAttempts = 3;
        
        function openApp() {
            console.log(`Attempt ${attempts + 1} to open app: ${deepLinkUrl}`);
            
            // Try to open the app
            window.location.href = deepLinkUrl;
            
            // Fallback timeout - if app doesn't open, show button
            setTimeout(() => {
                if (attempts === 0) {
                    document.getElementById('openAppButton').style.display = 'inline-block';
                    document.querySelector('.message').innerHTML = 'Click the button below to open the app';
                }
            }, 2000);
        }
        
        function tryOpenApp() {
            attempts++;
            openApp();
        }
        
        // Multiple methods to open the app
        
        // Method 1: Direct redirect after 500ms
        setTimeout(tryOpenApp, 500);
        
        // Method 2: Using iframe as fallback
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = deepLinkUrl;
        document.body.appendChild(iframe);
        
        // Remove iframe after 3 seconds
        setTimeout(() => {
            iframe.remove();
        }, 3000);
        
        // Method 3: Using window.location with different approaches
        setTimeout(() => {
            const link = document.createElement('a');
            link.href = deepLinkUrl;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            setTimeout(() => link.remove(), 100);
        }, 1000);
        
        // Set up button click handler
        const button = document.getElementById('openAppButton');
        button.style.display = 'none';
        button.addEventListener('click', function(e) {
            e.preventDefault();
            openApp();
        });
        
        // Check if we're already in the app's webview
        if (navigator.userAgent.includes('UFAAReunite')) {
            console.log('Already in app webview');
            window.location.href = deepLinkUrl;
        }
        
        // Display error if all attempts fail after 10 seconds
        setTimeout(() => {
            if (attempts === 0 || (attempts < maxAttempts && !document.hidden)) {
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.textContent = 'Unable to open the app automatically. Please make sure UFAA Reunite is installed on your device.';
                errorDiv.style.display = 'block';
            }
        }, 10000);
    </script>
</body>
</html>
