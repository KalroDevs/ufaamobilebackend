<!DOCTYPE html>
<html>
<head>
    <title>Redirecting to UFAA Reunite...</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #262561 0%, #1a1a4f 100%);
            color: white;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo span {
            font-size: 40px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #E4B355;
            animation: spin 1s ease-in-out infinite;
            margin: 30px auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background-color: #E4B355;
            color: #262561;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        .button:hover {
            background-color: #d4a345;
            transform: scale(1.02);
        }
        
        .button:active {
            transform: scale(0.98);
        }
        
        .message {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 16px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .button {
                padding: 12px 24px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span>🏦</span>
        </div>
        <h1>UFAA Reunite</h1>
        <p>Redirecting you back to the app...</p>
        <div class="spinner"></div>
        <p class="message">Please wait while we redirect you to the UFAA Reunite app.</p>
        <button id="openAppButton" class="button" style="display: none;">Open UFAA Reunite App</button>
    </div>

    <script>
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const params = {};
        for (const [key, value] of urlParams.entries()) {
            params[key] = value;
        }
        
        console.log('Callback params:', params);
        
        // Build deep link URL
        const queryString = new URLSearchParams(params).toString();
        const deepLinkUrl = `ufaareunite://callback?${queryString}`;
        
        console.log('Deep link URL:', deepLinkUrl);
        
        let attempts = 0;
        
        function openApp() {
            attempts++;
            console.log(`Attempt ${attempts} to open app: ${deepLinkUrl}`);
            
            // Try to open the app via window.location
            window.location.href = deepLinkUrl;
            
            // Fallback: show button after 2 seconds if app doesn't open
            setTimeout(() => {
                if (attempts === 1) {
                    const button = document.getElementById('openAppButton');
                    button.style.display = 'inline-block';
                    button.addEventListener('click', function(e) {
                        e.preventDefault();
                        window.location.href = deepLinkUrl;
                    });
                    document.querySelector('.message').innerHTML = 'Click the button below to open the app';
                }
            }, 2000);
        }
        
        // Try to open the app after 500ms
        setTimeout(openApp, 500);
        
        // Also try with iframe as fallback
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = deepLinkUrl;
        document.body.appendChild(iframe);
        
        setTimeout(() => {
            iframe.remove();
        }, 3000);
    </script>
</body>
</html>
